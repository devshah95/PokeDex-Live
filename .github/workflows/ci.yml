name: CI — Test, Scan, Build, Deploy

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  AWS_REGION: us-east-2
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-2.amazonaws.com

jobs:
  # ── JOB 1: Unit Tests ─────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, pokemon-service, favorites-service]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: services/${{ matrix.service }}/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: services/${{ matrix.service }}

    - name: Run unit tests with coverage
      run: npm test -- --coverage --coverageReporters=lcov
      working-directory: services/${{ matrix.service }}

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.service }}
        path: services/${{ matrix.service }}/coverage/lcov.info

  # ── JOB 2: OWASP Dependency Check ─────────────────────────────────────
  owasp:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Run OWASP Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: 'pokeshop'
        path: '.'
        format: 'HTML'
        args: >
          --failOnCVSS 7
          --enableRetired
          --scan ./services/auth-service/package.json
          --scan ./services/pokemon-service/package.json
          --scan ./services/favorites-service/package.json
          --scan ./frontend/package.json

    - name: Upload OWASP report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: owasp-report
        path: reports/

  # ── JOB 3: SonarQube Analysis ─────────────────────────────────────────
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      with:
        args: >
          -Dsonar.projectKey=pokeshop
          -Dsonar.sources=services
          -Dsonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js
          -Dsonar.javascript.lcov.reportPaths=coverage-auth-service/lcov.info,coverage-pokemon-service/lcov.info,coverage-favorites-service/lcov.info

    - name: SonarQube Quality Gate Check
      uses: SonarSource/sonarqube-quality-gate-action@master
      timeout-minutes: 5
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # ── JOB 4: Build + Trivy Scan + Push to ECR ───────────────────────────
  build-and-push:
    name: Build, Scan & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, owasp, sonarqube]
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
        - service: auth-service
          context: ./services/auth-service
        - service: pokemon-service
          context: ./services/pokemon-service
        - service: favorites-service
          context: ./services/favorites-service
        - service: frontend
          context: ./frontend
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker image
      run: |
        IMAGE_URI="${{ env.ECR_REGISTRY }}/pokeshop-${{ matrix.service }}:${{ github.sha }}"
        if [ "${{ matrix.service }}" = "frontend" ]; then
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            API_BASE="https://api.devopswithdev.com"
          else
            API_BASE="https://dev-api.devopswithdev.com"
          fi
          docker build \
            --build-arg VITE_AUTH_URL="${API_BASE}" \
            --build-arg VITE_POKEMON_URL="${API_BASE}" \
            --build-arg VITE_FAVORITES_URL="${API_BASE}" \
            -t "$IMAGE_URI" \
            ${{ matrix.context }}
        else
          docker build -t "$IMAGE_URI" ${{ matrix.context }}
        fi
        echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

    - name: Trivy — Scan Docker image for vulnerabilities
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.IMAGE_URI }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'

    - name: Upload Trivy report to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Push image to ECR
      run: |
        docker push ${{ env.IMAGE_URI }}
        LATEST_TAG="${{ env.ECR_REGISTRY }}/pokeshop-${{ matrix.service }}:latest"
        docker tag ${{ env.IMAGE_URI }} $LATEST_TAG
        docker push $LATEST_TAG

  # ── JOB 5: Slack Notification ─────────────────────────────────────────
  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: |
          *PokéDex Live CI Pipeline*
          Branch: `${{ github.ref_name }}`
          Commit: `${{ github.sha }}`
          Status: ${{ needs.build-and-push.result }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
