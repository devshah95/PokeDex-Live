name: Infrastructure — Terraform

on:
  pull_request:
    paths: ['infrastructure/**']
  push:
    branches: [main]
    paths: ['infrastructure/**']

jobs:
  # On PRs: run terraform plan and post output as a PR comment
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
        aws-region: us-east-2

    - uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: cd infrastructure && terraform init

    - name: Terraform Plan
      id: plan
      run: cd infrastructure && terraform plan -no-color
      continue-on-error: true

    # Post the plan as a PR comment so the team can review before merging
    - name: Post plan to PR
      uses: actions/github-script@v7
      with:
        script: |
          const plan = `${{ steps.plan.outputs.stdout }}`;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Terraform Plan\n\`\`\`terraform\n${plan}\n\`\`\``
          });

  # On merge to main: run terraform apply
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.ACTIONS_ROLE_ARN }}
        aws-region: us-east-2

    - uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: cd infrastructure && terraform init

    - name: Terraform Apply
      run: cd infrastructure && terraform apply -auto-approve
