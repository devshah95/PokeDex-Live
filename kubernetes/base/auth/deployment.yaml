apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pokeshop-sa
      containers:
      - name: auth-service
        image: 704225640908.dkr.ecr.us-east-2.amazonaws.com/pokeshop-auth-service:latest
        ports:
        - containerPort: 3001
        envFrom:
        - configMapRef:
            name: pokeshop-config
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: db_host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: db_user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: db_password
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: db_name
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: jwt_secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 5
