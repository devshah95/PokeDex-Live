apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- namespace.yaml
- configmap.yaml
- ../../base/auth
- ../../base/pokemon
- ../../base/favorites
- ../../base/frontend
- ../../base/httproute-api.yaml
- ../../base/httproute-frontend.yaml

namespace: pokeshop-dev

images:
- name: 704225640908.dkr.ecr.us-east-2.amazonaws.com/pokeshop-auth-service
  newTag: latest
- name: 704225640908.dkr.ecr.us-east-2.amazonaws.com/pokeshop-pokemon-service
  newTag: latest
- name: 704225640908.dkr.ecr.us-east-2.amazonaws.com/pokeshop-favorites-service
  newTag: latest
- name: 704225640908.dkr.ecr.us-east-2.amazonaws.com/pokeshop-frontend
  newTag: latest

patches:
# Patch ServiceAccount with dev IRSA role ARN
- patch: |-
    - op: replace
      path: /metadata/annotations/eks.amazonaws.com~1role-arn
      value: arn:aws:iam::704225640908:role/pokeshop-dev-pod-role
  target:
    kind: ServiceAccount
    name: pokeshop-sa

# Dev uses 1 replica to save cost
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment

# Dev API hostname
- patch: |-
    - op: replace
      path: /spec/hostnames/0
      value: dev-api.devopswithdev.com
  target:
    kind: HTTPRoute
    name: api-routes

# Dev frontend hostname
- patch: |-
    - op: replace
      path: /spec/hostnames/0
      value: dev.devopswithdev.com
  target:
    kind: HTTPRoute
    name: frontend-route
