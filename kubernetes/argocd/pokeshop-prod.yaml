apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pokeshop-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/devshah95/PokeDex-Live.git
    targetRevision: main
    path: kubernetes/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: pokeshop-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
