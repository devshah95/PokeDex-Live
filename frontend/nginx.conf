server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This is critical for React Router — without it, refreshing on /login
    # would return a 404 because there is no actual file at that path.
    # try_files checks for a real file first, then falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for Kubernetes probes
    location /health {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}